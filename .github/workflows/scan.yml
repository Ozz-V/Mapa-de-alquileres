name: Cartel Scanner

on:
  workflow_dispatch:
    inputs:
      reset:
        description: 'Reiniciar desde cero (borra seen.json)'
        required: false
        default: 'no'
        type: choice
        options:
          - 'no'
          - 'si'

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependencias
        run: pip install requests staticmap Pillow matplotlib google-generativeai

      - name: Reset (si se pidio)
        if: ${{ github.event.inputs.reset == 'si' }}
        run: |
          rm -f seen.json resultados.json osm_points.json
          echo "Reset completo - empezando desde cero"

      - name: Correr scanner
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          GEMINI_API_KEY:      ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_TOKEN:      ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID:    ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py

      - name: Guardar progreso
        if: always()
        run: |
          git config user.name  "cartel-scanner-bot"
          git config user.email "bot@users.noreply.github.com"
          git add resultados.json seen.json osm_points.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "chore: progreso scan $(date +%Y-%m-%d) [skip ci]"
          git push
